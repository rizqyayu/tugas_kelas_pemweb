<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Buat Akun</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Buat Akun</h2>
        <p>Daftar untuk membuat akun baru</p>

        <!-- Kotak notifikasi pesan sukses / error -->
        <div id="registerMessage" class="alert-message"></div>

        <!-- Form Registrasi -->
        <form id="registerForm">
            <label for="regNama">Nama Lengkap</label>
            <input 
                type="text" 
                id="regNama" 
                placeholder="Masukkan nama lengkap" 
                required
            >

            <label for="regEmail">Email</label>
            <input 
                type="email" 
                id="regEmail" 
                placeholder="Masukkan email" 
                required
            >

            <label for="regPassword">Password</label>
            <input 
                type="password" 
                id="regPassword" 
                placeholder="Buat password (min. 6 karakter)" 
                required
            >

            <label for="regConfirmPassword">Konfirmasi Password</label>
            <input 
                type="password" 
                id="regConfirmPassword" 
                placeholder="Ulangi password" 
                required
            >

            <button type="submit">Daftar</button>
        </form>

        <!-- Link menuju halaman Login -->
        <p class="link">
            Sudah punya akun? 
            <a href="login.html">Login di sini</a>
        </p>
    </div>

    <!-- Hubungkan ke script.js -->
    <script src="script.js"></script>

</body>
</html>
